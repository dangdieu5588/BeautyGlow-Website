name: beautyglow-website

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: beautyglow_catalog
      MYSQL_USER: beautyglow_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a new BeautyGlow application password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a different BeautyGlow root password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP
          --host=127.0.0.1 --user="$${MYSQL_USER}"
          --database="$${MYSQL_DATABASE}" --execute='SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *logging

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: beautyglow_catalog
      WORDPRESS_DB_USER: beautyglow_app
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set a new BeautyGlow application password}
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/plugins/beautyglow-products:/var/www/html/wp-content/plugins/beautyglow-products:ro
    networks:
      - frontend
      - database
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # curl exists in the inspected wordpress:php8.3-apache image.
      # Do not follow redirects: first-time setup can redirect to the installer.
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --noproxy
        - "*"
        - --max-time
        - "5"
        - --output
        - /dev/null
        - http://127.0.0.1/wp-login.php
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    logging: *logging

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      PMA_ARBITRARY: "0"
      UPLOAD_LIMIT: 32M
    ports:
      - "127.0.0.1:${PHPMYADMIN_HTTP_PORT:?Choose a verified free phpMyAdmin host port}:80"
    networks:
      - database
      - frontend
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *logging

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BEAUTYGLOW_HTTP_PORT:?Choose a verified free website host port}:80"
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    depends_on:
      wordpress:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    networks:
      - frontend
      - monitoring
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.20.0
    restart: unless-stopped
    command:
      - --config.my-cnf=/run/secrets/mysqld-exporter.cnf
      - --mysqld.address=mysql:3306
      - --no-collect.slave_status
      - --no-collect.info_schema.innodb_cmp
      - --no-collect.info_schema.innodb_cmpmem
      - --no-collect.info_schema.query_response_time
    volumes:
      - type: bind
        source: /var/lib/beautyglow-secrets/mysqld-exporter.cnf
        target: /run/secrets/mysqld-exporter.cnf
        read_only: true
        bind:
          create_host_path: false
    networks:
      - database
      - monitoring
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./config/exporters/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - frontend
      - monitoring
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.4
    user: "472:0"
    restart: unless-stopped
    # Refuse accidental first boot while the approved secret is still empty.
    entrypoint:
      - /bin/sh
      - -ec
      - test -s /run/secrets/grafana-admin-password || { echo "Grafana admin secret is not initialized" >&2; exit 1; }; exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: beautyglow_grafana_admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_SERVER_ROOT_URL: http://localhost:13000/
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - type: bind
        source: /var/lib/beautyglow-secrets/grafana-admin-password
        target: /run/secrets/grafana-admin-password
        read_only: true
        bind:
          create_host_path: false
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      # Host CPU/RAM only: do not report the bridge container's network as host.
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.loadavg
      - --collector.stat
      - --collector.time
      - --collector.uname
      - --collector.vmstat
      - --collector.pressure
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - monitoring
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    # Raw cgroup CPU/RAM collection; no Docker socket, host root or privileged.
    cgroup: host
    command:
      - --docker_only=false
      - --enable_metrics=cpu,memory
      - --housekeeping_interval=15s
      - --store_container_labels=false
    volumes:
      - /sys:/sys:ro
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

networks:
  frontend:
    name: beautyglow-website_frontend
    driver: bridge
  database:
    name: beautyglow-website_database
    driver: bridge
    internal: true
  monitoring:
    name: beautyglow-website_monitoring
    driver: bridge

volumes:
  mysql_data:
    name: beautyglow-website_mysql_data
  wordpress_data:
    name: beautyglow-website_wordpress_data
  prometheus_data:
    name: beautyglow-website_prometheus_data
  grafana_data:
    name: beautyglow-website_grafana_data
