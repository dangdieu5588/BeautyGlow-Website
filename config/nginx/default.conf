# Local HTTP demo. TLS and HSTS require a separate approved HTTPS setup.
# Dynamic upstream DNS is supported by the configured nginx:1.28-alpine image.
upstream beautyglow_wordpress {
    zone beautyglow_wordpress 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server wordpress:80 resolve;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 32m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://beautyglow_wordpress;
        proxy_http_version 1.1;
        # Preserve the external port so WordPress generates consistent URLs.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx is the only published website entry point: discard supplied XFF.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# BeautyGlow monitoring: Docker-internal only; no host port mapping.
server {
    listen 8081;
    server_name _;
    server_tokens off;
    access_log off;

    location = /stub_status {
        stub_status;
    }

    location / {
        return 404;
    }
}
